<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
  <meta name="description" content="Reporta Ya - Sistema de reporte de problemas en Sevilla" />
  <meta name="theme-color" content="#003B73" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reporta Ya" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Reporta Ya" />
  <meta name="msapplication-TileColor" content="#003B73" />
  <meta name="msapplication-config" content="/browserconfig.xml" />
  <title>Reporta Ya - Sevilla</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #003B73;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #002855;
    }

    /* Custom scrollbar for mobile menu */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.35);
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.3);
    }

    /* Prevent text selection on mobile menu */
    .mobile-menu-no-select {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-bgLight text-slate-800 dark:bg-slate-950 dark:text-slate-100 touch-manipulation">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // Register service worker for offline support and PWA features
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          console.log('Service Worker registration failed or not available');
        });
      });
    }
  </script>
</body>

</html>
